name: Skill checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/core.test.mjs
      - run: python3 tests/wps_overlay.py
      - run: |
          node --check genoffice-official-typeset/scripts/format-official.mjs
          node --check genoffice-official-typeset/scripts/format-wps-body.mjs
          python3 -m py_compile genoffice-official-typeset/scripts/apply-wps-body.py genoffice-official-typeset/scripts/apply-genoffice-compat.py
          node --check genoffice-official-typeset/scripts/genoffice-bridge.cjs
          node --check genoffice-official-typeset/scripts/runtime.cjs
